<mat-form-field class="input-password">
  <mat-label>Senha</mat-label>
  <input matInput
         [type]="hide ? 'password' : 'text'"
         [value]="value"
         [disabled]="disabled"
         (input)="handleInput($event)"
         (blur)="handleBlur()">
    <mat-icon class="material-symbols-outlined input-password__icon" (click)="toggleVisibility()" >{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
</mat-form-field>
