<mat-form-field class="input">
  <mat-label>{{ label }}</mat-label>
  <input matInput
         [type]="type"
         [value]="value"
         [disabled]="disabled"
         (input)="handleInput($event)"
         (blur)="handleBlur()">
  <mat-icon class="material-symbols-outlined input__icon">
    check_circle
  </mat-icon>
</mat-form-field>
